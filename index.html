<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIYOJO ACADÉMIA | Marketing Digital & Montage Vidéo</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ================= VARIABLES & RESET ================= */
        :root {
            --primary: #1e3a8a; /* Bleu pro */
            --secondary: #25d366; /* Vert WhatsApp */
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-light: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding-bottom: 80px; }
        
        /* ================= HEADER & HERO ================= */
        header { background: var(--primary); color: white; padding: 3rem 1rem; text-align: center; }
        .hero-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid white; margin-bottom: 1rem; }
        header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        header p { font-size: 1.1rem; max-width: 600px; margin: 0 auto; opacity: 0.9; }

        /* ================= NAVIGATION SERVICES ================= */
        .services-nav { display: flex; justify-content: center; gap: 1rem; padding: 2rem 1rem; flex-wrap: wrap; }
        .btn-nav {
            padding: 1rem 2rem; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; background: white; color: var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .btn-nav.active { background: var(--primary); color: white; }
        .btn-nav:hover { transform: translateY(-2px); }

        /* ================= GRILLE PRODUITS/SERVICES ================= */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 1rem; }
        #loader { text-align: center; display: none; padding: 2rem; color: var(--text-light); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; padding-bottom: 3rem; }
        
        .card {
            background: white; border-radius: 12px; padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--primary);
            display: flex; flex-direction: column;
        }
        .card h3 { font-size: 1.3rem; margin-bottom: 0.5rem; color: var(--primary); }
        .card .price { font-size: 1.2rem; font-weight: bold; color: var(--secondary); margin-bottom: 1rem; }
        .card p { color: var(--text-light); margin-bottom: 1.5rem; flex-grow: 1; }
        
        /* ================= BOUTONS D'ACTION ================= */
        .actions { display: flex; gap: 0.5rem; flex-direction: column; }
        .btn { padding: 0.8rem; border-radius: 6px; text-align: center; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #152c69; }
        .btn-whatsapp { background: var(--secondary); color: white; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-whatsapp:hover { background: #1ebd5c; }

        /* ================= BOUTON WHATSAPP FLOTTANT ================= */
        .floating-wa {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--secondary); color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            text-decoration: none; z-index: 1000; transition: transform 0.3s;
        }
        .floating-wa:hover { transform: scale(1.1); }

        /* ================= FOOTER ================= */
        footer { text-align: center; padding: 2rem; color: var(--text-light); background: white; margin-top: 2rem; }
    </style>
</head>
<body>

    <header>
        <img src="image.jpg" alt="Jonathan Kiyojo" class="hero-img" onerror="this.src='https://via.placeholder.com/120'">
        <h1>KIYOJO ACADÉMIA</h1>
        <p>Fondée par Jonathan Kiyojo. Web-entrepreneur & expert digital.<br>Nous propulsons votre business grâce au Marketing Digital et au Montage Vidéo percutant.</p>
    </header>

    <div class="services-nav">
        <button class="btn-nav active" onclick="loadData('marketing', this)">Marketing Digital</button>
        <button class="btn-nav" onclick="loadData('video', this)">Montage Vidéo</button>
    </div>

    <div class="container">
        <div id="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><br>Chargement des services...</div>
        <div id="data-container" class="grid">
            </div>
    </div>

    <a href="https://wa.me/243827445800?text=Bonjour%20Jonathan,%20je%20vous%20contacte%20depuis%20KIYOJO%20ACADÉMIA." class="floating-wa" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer>
        <p>KIYOJO ACADÉMIA © 2026</p>
        <p><i class="fas fa-envelope"></i> joe489581@gmail.com | <i class="fab fa-whatsapp"></i> +243 827 445 800</p>
    </footer>

    <script>
        const phone = "243827445800";
        
        // Liens d'export CSV depuis Google Sheets
        const urls = {
            marketing: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdi5Y7NVTJLxYbzV8tNIvnPtTiXDwjYEztdbuna6r-FsdvaMtajI01mKTtZXjjkz89Imt5JMng6X_D/pub?gid=0&single=true&output=csv",
            video: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdi5Y7NVTJLxYbzV8tNIvnPtTiXDwjYEztdbuna6r-FsdvaMtajI01mKTtZXjjkz89Imt5JMng6X_D/pub?gid=325166811&single=true&output=csv"
        };

        // Fonction principale pour charger et afficher les données
        function loadData(serviceType, buttonElement) {
            // Gérer l'état actif des boutons
            if (buttonElement) {
                document.querySelectorAll('.btn-nav').forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }

            const container = document.getElementById('data-container');
            const loader = document.getElementById('loader');
            
            container.innerHTML = ""; // Vider le conteneur
            loader.style.display = "block"; // Afficher le chargement

            // Utilisation de PapaParse pour lire le CSV de manière sécurisée
            Papa.parse(urls[serviceType], {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    loader.style.display = "none";
                    const data = results.data;
                    
                    data.forEach(item => {
                        // Création de la carte HTML
                        const card = document.createElement('div');
                        card.className = 'card';

                        // Variables communes
                        const titre = serviceType === 'marketing' ? item.Nom_Produit : item.Titre_Service;
                        const desc = item.Description || "Aucune description";
                        const prix = item.Prix || "Sur devis";
                        
                        // Message WhatsApp personnalisé pour ce service
                        const waMessage = encodeURIComponent(`Bonjour Jonathan, je suis intéressé par le service : ${titre}. Pouvons-nous en discuter ?`);
                        const waLink = `https://wa.me/${phone}?text=${waMessage}`;

                        let boutonsHTML = '';

                        // Boutons selon le service
                        if (serviceType === 'marketing') {
                            const lienProduit = item.URL ? item.URL : '#';
                            boutonsHTML = `
                                <a href="${lienProduit}" class="btn btn-primary" target="_blank">Voir le produit</a>
                                <a href="${waLink}" class="btn btn-whatsapp" target="_blank"><i class="fab fa-whatsapp"></i> Discuter</a>
                            `;
                        } else {
                            boutonsHTML = `
                                <a href="${waLink}" class="btn btn-whatsapp" target="_blank"><i class="fab fa-whatsapp"></i> Discuter</a>
                            `;
                        }

                        // Assemblage de la carte
                        card.innerHTML = `
                            <h3>${titre}</h3>
                            <div class="price">${prix}</div>
                            <p>${desc}</p>
                            <div class="actions">
                                ${boutonsHTML}
                            </div>
                        `;
                        
                        container.appendChild(card);
                    });
                },
                error: function(err) {
                    loader.style.display = "none";
                    container.innerHTML = "<p style='color:red;'>Erreur lors du chargement des données. Vérifiez que votre Google Sheet est bien publié sur le web.</p>";
                    console.error("Erreur PapaParse:", err);
                }
            });
        }

        // Charger la section "Marketing" par défaut au démarrage du site
        window.onload = () => {
            const firstBtn = document.querySelector('.btn-nav');
            loadData('marketing', firstBtn);
        };
    </script>
</body>
</html>
